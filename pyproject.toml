[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "molcraftdiffusion"
version = "1.12.1"
description = "A unified generative AI framework for 3D molecular generation using diffusion models"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Thanapat Worakul", email = "thanapat.worakul@epfl.ch"},
]
maintainers = [
  { name = "Thanapat Worakul", email = "thanapat.worakul@epfl.ch" },
]

# Core pip-installable dependencies (no PyTorch — install via [gpu] or [cpu] extra).
# NOTE: xtb and openbabel must be installed via conda before pip install:
#   conda install -c conda-forge xtb==6.7.1 openbabel
dependencies = [
    "click>=8.0.0",
    "fire",
    "decorator",
    "numpy",
    "scipy",
    "networkx",
    "matplotlib",
    "seaborn",
    "pandas",
    "scikit-learn",
    "tqdm",
    "pyyaml",
    "omegaconf",
    "tensordict",
    "rich",
    "lightning",
    "wandb",
    "hydra-colorlog",
    "hydra-core>=1.0.0",
    "rootutils",
    "psutil",
    "e3nn",
    "torchmetrics",
    "biotite",
    "datamol",
    # Imported unguarded at module level on the `MolCraftDiff train` path
    # (cli/train.py -> data/component/dataset.py), so they are core, not
    # optional: without them the primary command dies on ImportError, no
    # install hint. They used to be declared only in [data]/[analyze] --
    # rdkit happened to arrive transitively via datamol, ase had no such
    # backdoor. (A bare `import MolecularDiffusion` does not need either.)
    "ase",
    "rdkit",
    # `lightning` and `pytorch-lightning` are SEPARATE distributions. The code
    # imports both namespaces, so declaring only `lightning` was not enough.
    "pytorch-lightning",
    "lightning-utilities",
]

[project.optional-dependencies]
data = [
    "mendeleev",
    "safetensors",
    "dscribe",
    "openbabel>=3.2.0",
]
# DiffPharma novel-pocket preprocessing: raw PDB+SDF -> pocket + interaction
# pseudo-particles. Biopython parses the PDB, ODDT detects the H-bond and
# hydrophobic contacts. Needed ONLY for that path -- training and generating
# from converted ASE dbs import neither.
#
# Kept out of [data] on purpose: oddt 0.7 is unmaintained and calls np.in1d,
# removed in numpy 2.0, so data/component/diffpharma_prep.py aliases it back
# to np.isin at import. No reason to inflict that on every [data] user.
bio = [
    "oddt",
    "biopython",
]
analyze = [
    "posebusters>=0.5.1",
    "morfeus-ml",
    "rmsd",
    "open3d",
    "openbabel>=3.2.0",
    "posecheck",
]
# AutoDock Vina scoring for the `sbdd` metric set (binding affinity against a
# protein pocket). Pure pip, no external binaries and no conda: meeko builds
# the PDBQT inputs, vina scores them. All three install without touching
# anything else in a numpy-2 / pandas-2.3 environment -- deliberately NOT
# pulling in pdb2pqr (it downgrades docutils below the floor Sphinx and
# myst-parser require) or AutoDockTools (meeko's mk_prepare_receptor
# replaces it).
#
# gemmi is listed explicitly because meeko 0.7 declares NO dependencies in its
# wheel metadata, yet `import meeko` fails without gemmi
# (meeko.polymer -> meeko.chemtempgen -> gemmi).
sbdd = [
    "vina",
    "meeko",
    "gemmi",
]
# FlowMol backbone (coordinate-only GVP flow matching) needs DGL for its
# batched-graph message passing. Install the CUDA build manually from the DGL
# wheel index matching the environment's torch+CUDA (project convention is
# --no-deps, manual CUDA deps), e.g. for torch 2.4 + cu124:
#   pip install dgl -f https://data.dgl.ai/wheels/torch-2.4/cu124/repo.html
flowmol = [
    "dgl",
]
# DiffSMol shape precompute (molecule -> surface mesh -> point cloud). Needed
# ONLY to build the shape cache offline; training and generation read the
# cached tensors and import none of this. No openbabel and no oddt: oddt 0.7's
# surface module imports `skimage.measure.marching_cubes_lewiner`, removed in
# scikit-image 0.19, so it is dead on any modern env; its ~40-line marching-
# cubes surface is inlined in modules/models/diffsmol/shape_utils.py with
# openbabel's vdW radii hardcoded (and asserted).
# pytorch3d is deliberately NOT required -- trimesh's area-uniform
# `Trimesh.sample` replaces its one live call site.
shape = [
    "scikit-image",
    "trimesh",
]
# NExT-Mol: MoLlama (a 22-layer Llama over a 192-token SELFIES vocabulary)
# samples 1D molecule strings, which the DMT diffusion backbone then gives 3D
# coordinates. Needed ONLY for the de-novo generation path -- training DMT and
# conformer prediction from a given molecule import none of this, so the LM
# wrapper imports `transformers` lazily.
#
# Pinned exactly, and that matters: unpinned `pip install transformers` pulls
# 5.15.1, which upgrades huggingface_hub, click and hf-xet underneath an
# otherwise-working env. These six install with zero upgrades and zero
# downgrades (verified with --dry-run). safetensors also appears in [data];
# extras do not inherit, so it is repeated here on purpose.
#
# selfies is NOT listed: `datamol` already brings it in.
nextmol = [
    "transformers==5.3.0",
    "tokenizers==0.22.2",
    "safetensors==0.8.0",
    "regex==2026.7.19",
    "typer==0.27.1",
    "annotated-doc==0.0.5",
]
# GPU install (CUDA-capable torch wheels, auto-detected by pip on Linux/Windows):
#   pip install molcraftdiffusion[gpu]
gpu = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "torch_geometric",
    "torch_scatter",
    "torch_sparse",
    "torch_cluster",
    "torch_spline_conv",
]
# CPU-only install:
#   pip install molcraftdiffusion[cpu] --extra-index-url https://download.pytorch.org/whl/cpu
cpu = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "torch_geometric",
    "torch_scatter",
    "torch_sparse",
    "torch_cluster",
    "torch_spline_conv",
]
# macOS / Apple Silicon (MPS GPU) install -- see docs/installation.md:
#   pip install -e '.[mac]' && pip install ./mac_shims
# Plain PyPI torch on macOS arm64 ships MPS. The PyG C++ extensions are left
# out: they have no MPS kernels, and ./mac_shims provides pure-torch
# `torch_scatter` / `torch_cluster` instead. torch_geometric is capped below
# 2.8 because 2.8 ignores torch_cluster and needs pyg-lib>=0.6 for
# radius_graph/knn_graph, which has no torch-2.6 build. Linux/WSL: use [gpu]/[cpu].
mac = [
    "torch==2.6.0",
    "torch_geometric<2.8",
    "morfeus-ml",
]
# `huggingface_hub` is here and NOT in the runtime dependencies on purpose.
# Users only ever DOWNLOAD zoo assets, which `MolecularDiffusion/assets.py`
# does over plain HTTPS through `utils/file.py::download` -- stdlib urllib,
# no extra package. Only the maintainer-side upload path
# (`MolCraftDiff zoo publish`) imports it.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
    "huggingface_hub",
]
docs = [
    "sphinx>=7.4",
    "furo>=2024.1.29",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autoapi>=3.1",
    "sphinx-sitemap>=2.6",
    "sphinx-design>=0.6",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/pregHosh/MolCraftDiffusion"
Repository = "https://github.com/pregHosh/MolCraftDiffusion"
Documentation = "https://preghosh.github.io/MolCraftDiffusion/"
"Bug Tracker" = "https://github.com/pregHosh/MolCraftDiffusion/issues"

[project.scripts]
MolCraftDiff = "MolecularDiffusion.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"MolecularDiffusion" = [
    "*.py", "*.txt", "*.rst", "*.md",
    "data/**/*.json",
    "configs/**/*.yaml",
    "configs/**/*.xyz",
    "zoo.yaml",
    "**/*.pt", "**/*.npz",
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN101", "ANN401", "COM812", "ISC001","ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "S101",
  "INP001",
  "ANN101",
  "ANN201",
]
"examples/*" = [
  "INP001",
]
"docs/source/conf.py" = ["D100", "INP001"]

[tool.mypy]
show_error_codes = true
implicit_optional = false
warn_no_return = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unreachable = true
disallow_any_generics = true

[tool.uv]
environments = [
  'python_full_version == "3.11.*" and sys_platform == "linux"',
  'python_full_version == "3.11.*" and sys_platform == "darwin"',
]

[[tool.mypy.overrides]]
module = []
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
  "diffusion: diffusion model compatibility tests",
  "generation: generation config and runtime compatibility tests",
  "regression: regression model compatibility tests",
  "tabasco: TABASCO model compatibility tests",
  "ssl3d: SSL3D model compatibility tests",
  "pharmacophore: pharmacophore model compatibility tests",
]
