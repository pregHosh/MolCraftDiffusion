[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "molcraftdiffusion"
version = "1.3.0"
description = "A unified generative AI framework for 3D molecular generation using diffusion models"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Thanapat Worakul", email = "thanapat.worakul@epfl.ch"},
]
maintainers = [
  { name = "Thanapat Worakul", email = "thanapat.worakul@epfl.ch" },
]

# Core pip-installable dependencies (no PyTorch — install via [gpu] or [cpu] extra).
# NOTE: xtb and openbabel must be installed via conda before pip install:
#   conda install -c conda-forge xtb==6.7.1 openbabel
dependencies = [
    "click>=8.0.0",
    "fire",
    "decorator",
    "numpy",
    "scipy",
    "networkx",
    "matplotlib",
    "seaborn",
    "pandas",
    "scikit-learn",
    "tqdm",
    "pyyaml",
    "omegaconf",
    "tensordict",
    "rich",
    "lightning",
    "wandb",
    "hydra-colorlog",
    "hydra-core>=1.0.0",
    "rootutils",
    "psutil",
    "e3nn",
    "torchmetrics",
    "biotite",
    "datamol",
]

[project.optional-dependencies]
data = [
    "ase",
    "rdkit-pypi",
    "mendeleev",
    "safetensors",
    "dscribe",
    "openbabel>=3.2.0",
]
analyze = [
    "ase",
    "rdkit-pypi",
    "posebusters>=0.5.1",
    "morfeus-ml",
    "rmsd",
    "open3d",
    "openbabel>=3.2.0",
    "posecheck",
]
# GPU install (CUDA-capable torch wheels, auto-detected by pip on Linux/Windows):
#   pip install molcraftdiffusion[gpu]
gpu = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "torch_geometric",
    "torch_scatter",
    "torch_sparse",
    "torch_cluster",
    "torch_spline_conv",
]
# CPU-only install:
#   pip install molcraftdiffusion[cpu] --extra-index-url https://download.pytorch.org/whl/cpu
cpu = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "torch_geometric",
    "torch_scatter",
    "torch_sparse",
    "torch_cluster",
    "torch_spline_conv",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/pregHosh/MolCraftDiffusion"
Repository = "https://github.com/pregHosh/MolCraftDiffusion"
Documentation = "https://preghosh.github.io/MolCraftDiffusion/"
"Bug Tracker" = "https://github.com/pregHosh/MolCraftDiffusion/issues"

[project.scripts]
MolCraftDiff = "MolecularDiffusion.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"MolecularDiffusion" = [
    "*.py", "*.txt", "*.rst", "*.md",
    "data/**/*.json",
    "configs/**/*.yaml",
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN101", "ANN401", "COM812", "ISC001","ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "S101",
  "INP001",
  "ANN101",
  "ANN201",
]
"examples/*" = [
  "INP001",
]
"docs/source/conf.py" = ["D100", "INP001"]

[tool.mypy]
show_error_codes = true
implicit_optional = false
warn_no_return = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unreachable = true
disallow_any_generics = true

[tool.uv]
environments = [
  'python_full_version == "3.11.*" and sys_platform == "linux"',
  'python_full_version == "3.11.*" and sys_platform == "darwin"',
]

[[tool.mypy.overrides]]
module = []
ignore_missing_imports = true
