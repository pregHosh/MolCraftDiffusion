# Tutorial 1: Training a Diffusion Model from Scratch
# Usage: MolCraftDiff train docs/cfg_examples/train_diffusion
#
# This trains an EDM diffusion model on QM9. Adapt paths and
# dataset_name for your own data.

defaults:
  - data: mol_dataset
  - tasks: diffusion
  - logger: default
  - trainer: default
  - engine: original
  - hydra: default
  - _self_

name: "EDM_qm9"                   # used as run name in logs
seed: 86
tags: ["EDM", "qm9", "benchmark"]
contexts: []                       # no conditioning; set to property names for CFG

trainer:
  output_path: "training_outputs/benchmark/${name}"
  num_steps: 300000
  lr: 0.0001
  init_grad_norm: 3000
  ema_decay: 0.999
  validation_interval: 2
  gradient_clip_algorithm: "adaptive"

logger:
  project_wandb: "MolCraftDiffusion"

data:
  data_type: "pointcloud"
  atom_vocab: [H, C, N, O, F]           # <-- set vocab to match your dataset
  use_ohe_feature: True
  batch_size: 64
  root: "data/"
  max_atom: 86
  dataset_name: "qm9"                    # unique name → processed_data_qm9.pt
  ase_db_path: "data/qm9.db"            # <-- path to your ASE database
  data_efficient_collator: true
  target_fields: ${contexts}

tasks:
  hidden_size: 256
  num_sublayers: 1
  num_layers: 12
  condition_names: ${contexts}
  generative_analysis: True
  # generative_eval_use_ema: true   # lightning engine: sample from the EMA weights (default: raw)
  use_posebuster: True
  n_samples: 64
  sp_regularizer_deploy: False
  sp_regularizer_regularizer: hard
  sp_regularizer_lambda_: 1000
  sp_regularizer_lambda_2: 1000
  sp_regularizer_lambda_update_value: 0.5
  sp_regularizer_warm_up_steps: 0
