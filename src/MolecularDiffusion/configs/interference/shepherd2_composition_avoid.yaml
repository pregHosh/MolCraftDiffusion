# ShEPhERD-2 generation (permanent).
#
# A per-model interference config rather than a bundled one: the shared
# gen_unconditional.yaml / gen_pocket.yaml carry neither the v2 EDM sampler
# knobs nor the v2 output channels, and the five bundled pharm_*.yaml target
# the ShEPhERD-v1 generator whose sampler takes a discrete timestep. The five
# pharm_*.yaml are deliberately left untouched so v1 keeps working.
#
# MULTI-PROFILE COMPOSITION, AND-NOT -- composition_mode "conditional".
#
# Unlike "default" this uses ONLY the supplied conditions (no implicit
# unconditional component) and therefore permits NEGATIVE weights: a profile
# with a negative weight is steered AWAY from. The canonical use is
# "resemble A but avoid B" (e.g. an off-target pharmacophore).
# Upstream's tutorial 3 uses [0.5, -0.5].
_target_: MolecularDiffusion.modules.tasks.shepherd2_generator.Shepherd2Generator
task_type: composition_avoid

reference_mols:
  - docs/model_integrations/shepherd2/data/fragment_merging/fragments/mol_0.mol
  - docs/model_integrations/shepherd2/data/fragment_merging/fragments/mol_1.mol
mol_idxs: [0, 0]
weights_conditions: [0.5, -0.5]   # second profile is AVOIDED
# composition_mode is forced to "conditional" by task_type=composition_avoid.

align_to_idx: null
align_condition: esp
alignment_start_frac: 0.0
alignment_interval: 10
alignment_mode: so3
alignment_ema_alpha: 1.0

condition_modalities: all
condition_com: origin
atom_condition: null

num_generate: 6
batch_size: 2
N_x1: [30, 50]
N_x4: 0                   # see distributions_path note below -- max(n_pharms) wins

# N_x4 = 0 does NOT mean "auto" to the shared seam: PharmacophoreConditionGenerator
# .__init__ (tasks_generate.py:1733-1741) hard-raises
#   ValueError: distributions_path must be set when N_x4=0
# the moment it sees 0 with no distributions file -- it raises BEFORE any
# conditioned code runs, so without these two keys this config cannot even be
# constructed. They exist purely to satisfy that constructor check: on the
# conditioned path the value is then overridden by max(p.n_pharms for p in profiles)
# (shepherd2_generator.py:380), so
# the empirical P(N_x4|N_x1) table below is loaded and never consulted.
# distributions_key MUST be moses_aq. atom_pharm_count.npz holds two (100,100)
# arrays, `gdb` and `moses_aq`; the seam's default is `gdb`, which is the
# ShEPhERD-v1 GDB-17 table and the wrong statistics for these MOSES-aq weights.
distributions_path: docs/model_integrations/shepherd2/data/distributions/atom_pharm_count.npz
distributions_key: moses_aq

num_surf_points: 75
probe_radius: 0.6
xtb_profile_optimize: true
solvent: water

num_steps: 400
sigma_max: 3.0
sigma_min: 0.001
rho: 7.0
shepherd_pred: true

save_modalities: true
write_bonds: true
write_sdf: true
xtb_optimize: true
xtb_timeout: 60
save_xyzrender_figures: false

seed: 42
verbose: true
output_path: generated_shepherd2_composition_avoid
