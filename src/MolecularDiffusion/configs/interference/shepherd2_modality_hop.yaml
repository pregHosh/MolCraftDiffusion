# ShEPhERD-2 generation (permanent).
#
# A per-model interference config rather than a bundled one: the shared
# gen_unconditional.yaml / gen_pocket.yaml carry neither the v2 EDM sampler
# knobs (early_stop_edm, sigma_max/min, rho, use_stochastic, S_churn, S_noise,
# shepherd_pred) nor the v2 output channels (write_bonds / write_sdf /
# xtb_optimize / store_trajectories), and the five bundled pharm_*.yaml target
# the ShEPhERD-v1 generator whose sampler takes a discrete timestep. The five
# pharm_*.yaml are deliberately left untouched so v1 keeps working.
#
# Modality hopping: build the profile from a reference (here a peptide PDB),
# then keep only the sub-pocket named by subselect_atom_inds via upstream's
# InteractionProfile.subselection(...). The generated ligand reproduces that
# sub-profile's interactions with a different chemotype.
#
# subselect_atom_inds is REQUIRED and intentionally has no default: the right
# atom indices depend entirely on which part of the reference you are hopping
# from, and silently defaulting to "all atoms" would make this config behave
# like shepherd2_condition.yaml while claiming not to.
_target_: MolecularDiffusion.modules.tasks.shepherd2_generator.Shepherd2Generator
task_type: modality_hop

reference_mol: docs/model_integrations/shepherd2/data/modality_hopping/nnmt_7wmc_peptide.pdb
mol_idx: 0
subselect_atom_inds: null   # e.g. [4, 5, 6, 7, 8, 9]
subselect_kwargs:
  expand_pharm_consistent: true
  restrict_esp: true
  probe_radius: 0.6
  include_h: false
condition_modalities: all
condition_com: origin

num_generate: 10
batch_size: 2
N_x1: [25, 45]
N_x4: 0                   # see distributions_path note below -- the subselected profile's count wins

# N_x4 = 0 does NOT mean "auto" to the shared seam: PharmacophoreConditionGenerator
# .__init__ (tasks_generate.py:1733-1741) hard-raises
#   ValueError: distributions_path must be set when N_x4=0
# the moment it sees 0 with no distributions file -- it raises BEFORE any
# conditioned code runs, so without these two keys this config cannot even be
# constructed. They exist purely to satisfy that constructor check: on the
# conditioned path the value is then overridden by the SUBSELECTED profile's pharmacophore count
# (profile.n_pharms, shepherd2_generator.py:418), so
# the empirical P(N_x4|N_x1) table below is loaded and never consulted.
# distributions_key MUST be moses_aq. atom_pharm_count.npz holds two (100,100)
# arrays, `gdb` and `moses_aq`; the seam's default is `gdb`, which is the
# ShEPhERD-v1 GDB-17 table and the wrong statistics for these MOSES-aq weights.
distributions_path: docs/model_integrations/shepherd2/data/distributions/atom_pharm_count.npz
distributions_key: moses_aq

num_surf_points: 75
probe_radius: 0.6
# true here (unlike the pkl-backed configs): a PDB ships no xTB charges, so the
# extractor computes them and may as well relax the geometry first.
xtb_profile_optimize: true
solvent: water

num_steps: 400
early_stop_edm: 0.9
sigma_max: 3.0
sigma_min: 0.001
rho: 7.0
shepherd_pred: true

save_modalities: true
write_bonds: true
write_sdf: true
xtb_optimize: true
xtb_timeout: 60
save_xyzrender_figures: false

seed: 42
verbose: true
output_path: generated_shepherd2_modality_hop
