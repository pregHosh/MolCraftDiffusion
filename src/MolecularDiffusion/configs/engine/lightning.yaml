# Use PyTorch Lightning Trainer
engine_type: lightning

# Lightning-specific trainer configuration
trainer_config:
  _target_: pytorch_lightning.Trainer

  # Training
  max_epochs: ${trainer.num_epochs}
  accelerator: auto
  devices: auto
  strategy: auto  # Lightning auto-selects ddp/ddp_spawn based on devices

  # Precision - converted to Lightning format in Python. Accepts 32, 16, bf16
  # (16 and bf16 mean mixed precision) or a Lightning name such as bf16-mixed,
  # 16-mixed, 64-true. Any other value falls back to 32 with a warning.
  precision: ${trainer.precision}

  # Optimization
  accumulate_grad_batches: 1
  gradient_clip_val: ${trainer.grad_clip_value}
  gradient_clip_algorithm: ${trainer.gradient_clip_mode}

  # Logging & Validation
  log_every_n_steps: ${logger.log_interval}
  # Lightning validates AFTER epochs N, 2N, ... (so never after epoch 0); the original
  # engine validates at epoch indices 0, N, 2N, .... Same number, different schedule.
  check_val_every_n_epoch: ${trainer.validation_interval}

  # Checkpointing
  enable_checkpointing: true
  default_root_dir: ${trainer.output_path}

  # Other
  num_sanity_val_steps: 0  # Skip sanity validation
  enable_progress_bar: true
  enable_model_summary: true

# Model summary table depth: PL's default (1) only shows the top-level
# LightningModule attribute ("task"), not its submodules (e.g. a GeoLDM
# task's frozen vae vs trainable dynamics network). Bump this to see deeper.
model_summary_max_depth: 3

# Periodic sleep (e.g., to relieve GPU thermal throttling)
# sleep_every_N: 0 disables the feature
sleep_every_N: 0
sleep_time: 60

# DataLoader worker config (keep num_workers low to avoid RAM exhaustion / freezes)
num_workers: 2
pin_memory: false
persistent_workers: false

# Set to false to resume from a checkpoint saved by an older task state_dict
# shape (e.g. a task added/removed a get_extra_state() key since that
# checkpoint was written) without a hard "Missing key(s)" failure.
strict_loading: true

# Generative evaluation (generative_analysis: true) generates from the RAW weights here,
# while the validation loss uses the EMA copy. The original engine uses EMA for both.
# Set at the top level of your config (or under tasks:) to generate from the EMA weights:
#   generative_eval_use_ema: true
