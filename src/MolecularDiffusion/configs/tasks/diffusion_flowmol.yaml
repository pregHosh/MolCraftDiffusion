# Coordinate-only FlowMol (SE(3)-equivariant GVP flow-matching backbone).
# Generated modalities: x (coords), a (atom types), c (formal charge).
# Bonds (the `e` modality) are NOT generated -- edges are a geometry-only
# message-passing convenience. See docs/model_integrations/flowmol.
_target_: MolecularDiffusion.modules.tasks.diffusion_flowmol.FlowMolTaskFactory
task_type: diffusion_flowmol

# Property-conditioning / classifier-free guidance -- same config signature
# as configs/tasks/diffusion.yaml (en_diffusion's EGNN formulation).
condition_names: []
context_mask_rate: 0.2
mask_value: 5
normalize_condition: value_10 # None | "maxmin" | "mad" | "value_N" (divide by N)
adapter_conditions: [] # subset of condition_names routed via the adapter MLP(s); TABASCO/FlowMol/EGNN only (PaiNN/ADiT raise if non-empty)
use_adapter_module: false       # deprecated-but-supported: route ALL conditions through the adapter

# formal-charge head (QM9-style neutral molecules: constant neutral target)
n_charges: 6
neutral_charge_index: 0

# Gaussian coordinate prior std (zero-COM per molecule)
prior_std: 1.0

time_scaled_loss: true
default_n_timesteps: 250
total_loss_weights:
  x: 1.0
  a: 1.0
  c: 1.0

# empty -> FlowMolTaskFactory.build() fills num_atoms_histogram from train_set
dataset_stats: {}

interpolant_scheduler_config:
  schedule_type: cosine
  cosine_params:
    x: 1.0
    a: 1.0
    c: 1.0

vector_field_config:
  n_vec_channels: 16
  n_cp_feats: 0
  n_hidden_scalars: 64
  n_hidden_edge_feats: 64
  n_recycles: 1
  n_molecule_updates: 2
  convs_per_update: 2
  n_message_gvps: 3
  n_update_gvps: 3
  n_expansion_gvps: 3
  separate_mol_updaters: false
  message_norm: 100
  update_edge_w_distance: true
  rbf_dmax: 20
  rbf_dim: 16
  time_embedding_dim: 1
  dropout: 0.0
