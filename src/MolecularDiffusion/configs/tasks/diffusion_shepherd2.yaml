# ShEPhERD-2 -- platform task config (permanent).
#
# GENERATED, not hand-written. Every value under `model_params` is a verbatim
# copy of `hyper_parameters['params']` inside the released checkpoint
#   docs/model_integrations/shepherd2/checkpoints/upstream/shepherd2-mosesaq-inference.ckpt
#   (HF kabeywar/shepherd2, repo sha 535116ad3cde2a3325daf4dc3f7a2dc7c04fb413,
#    epoch 18, global_step 309250, 838 tensors / 6,317,695 parameters)
# produced by:
#   docs/model_integrations/shepherd2/scripts/generate_task_config.py
#
# Why generated from the checkpoint rather than from the authors'
# `training/parameters/base.yaml`: the two DISAGREE, and the checkpoint is what
# the weights were actually trained with. Four recorded conflicts
# (INTEGRATION_PLAN.md "Hyperparameter Provenance"), checkpoint value first:
#   edm.sigma_max    3.0  (base.yaml says 2.0)
#   max_neighbors    1000000  everywhere (base.yaml says 2048)
#   training.ema.enabled  False  (base.yaml says True)
#   edm.rho          7.0  (absent from base.yaml entirely)
# Rebuilding this file from base.yaml would silently change the sampler's noise
# schedule and make the released weights load into the wrong architecture.
#
# ONE key is dropped from the checkpoint's params: `noise_schedules`, four
# 400-step DDPM alpha/sigma arrays left over from ShEPhERD-v1. ShEPhERD-2 is EDM
# (`edm.use_edm: true`) and passes a continuous per-molecule sigma instead of a
# timestep index; `grep -rn noise_schedules` over the whole vendored package
# finds no readers. It is also the only entry that is not YAML-representable.
#
# `dataset:` lives under model_params on purpose: configs/data/shepherd2_dataset.yaml
# interpolates `model_params: ${tasks.model_params}` so the architecture and the
# dataset construction can never drift apart.
#
# Out of scope with THESE weights (limitations of the release, not of the port):
#   * x2 / shape-only channel -- `dataset.compute_x2: false` and
#     `explicit_diffusion_variables: [x1, x3, x4]`; no x2 weights were released.
#   * property CFG -- the state_dict contains no `*prop*` keys, so the knob is inert.
#
_target_: MolecularDiffusion.modules.tasks.diffusion_shepherd2.Shepherd2Generative
task_type: diffusion_shepherd2

