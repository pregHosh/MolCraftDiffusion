      source: shepherd2/shepherd2-mosesaq-inference.ckpt from HF kabeywar/shepherd2 at repo
        sha 535116ad3cde2a3325daf4dc3f7a2dc7c04fb413 (25,601,974 B, epoch 18, global_step
        309,250), remapped model. -> model.model. -- a single prefix insertion over all 838
        tensors, asserted a bijection against a freshly built task, 0 dropped. The platform
        loader logs 838 keys offered, 0 missing, 0 unexpected.
      script: docs/model_integrations/shepherd2/scripts/convert_checkpoint.py
      note: 'LIMITATIONS OF THESE RELEASED WEIGHTS, not of the port. (1) RDKit validity over
        the GENERATED bonds caps around 0.67-0.73 (0.725 on an aliphatic reference, 0.667
        on an aromatic one); the failure mode is reference dependent -- every aliphatic-reference
        failure is a single over-valent atom, every aromatic-reference failure is Can''t kekulize
        mol. Geometry is clean either way: min interatomic distance 0.93-1.00 A, 0% clash
        rate, 1.03 undirected bonds per atom, uniqueness 1.00. (2) The x2 shape/surface channel
        was NEVER TRAINED (compute_x2 false, no x2 tensors published), so pure shape matching
        is NOT supported -- use shepherd/gdb17 or diffsmol. Shape still enters via the x3
        surface. (3) Property CFG is inert: no *prop* tensors in the state_dict. (4) compile_encoder
        must stay true -- torch.compile''s ._orig_mod. key segment is baked into all 838 keys,
        and flipping it off makes them silently fail to load under strict=False. (5) The xtb
        BINARY (not a pip package) is required for the .sdf and partial-charge output path;
        without it that step no-ops and only .xyz + _bonds.npz are written.'
