      and pockets_full always did (Tester Log attempt 7, 9/9 trials, 3 seeds each). pockets_unconditioned
      used to NaN on the first reverse step; that was a port bug, not a weight defect, and
      it is fixed (2026-09-07, 20/20 clean). Root cause: DiffLinker''s own collate builds
      its diagonal edge mask with ~torch.eye(const.TORCH_INT) where TORCH_INT is torch.int8,
      so ~ is a BITWISE not -- every released non-pocket weight was trained against a mask
      of -1 on real edges and -2 on self-loops, not 1/0. Reproducing that convention is what
