  shepherd2:
    family: interaction-profile-conditioned-diffusion
    task_type: diffusion_shepherd2
    tags:
    - interaction-profile-conditioned
    - ligand-conditioned
    - generates-bonds
    - pharmacophore
    - esp
    - surface
    - pretrained
    variants:
      default:
        checkpoint: shepherd2/pretrained
        data: data/moses_aq/scaffold-test
        extra:
          distributions: inputs/shepherd2/distributions
          fragment_merging: inputs/shepherd2/fragment_merging
          modality_hopping: inputs/shepherd2/modality_hopping
          molgenbench: data/molgenbench/hit-to-lead
          hdf5_train: data/moses_aq/hdf5
          moses_aq_ase: data/moses_aq/ase
        configs:
        - shepherd2_generate.yaml
    summary: 'ShEPhERD-2 (Abeywardane, Walker & Coley, bioRxiv 2026, doi 10.64898/2026.09.10.750648)
      generates 3D molecules conditioned on a reference LIGAND''s interaction profile -- its
      solvent-accessible surface, the electrostatic potential on that surface, and its pharmacophore
      points with direction vectors. There is no protein pocket anywhere in the inputs. It
      emits bond orders and formal charges directly rather than perceiving them from geometry
      afterwards, and output chemistry tracks the reference closely (47.4% aromatic bonds
      off a 48.5%-aromatic reference). Seven generation modes ship: unconditional, full profile,
      scaffold-constrained, pharmacophore-priority, modality hopping, and composition AND
      / AND-NOT over several profiles. Needs the [shepherd2] extra (open3d is a hard requirement,
      not a nicety) and the xtb binary for the .sdf output path.'
