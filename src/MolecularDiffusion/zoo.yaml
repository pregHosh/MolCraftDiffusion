  diffsmol/moses2-shape:
    kind: checkpoint
    host: models
    rev: main
    files:
    - path: diffsmol_moses2_shape.ckpt
      sha256: 38a22d40a5dc554093d9d1ff2847907341200ad48db944be211440aa09234cda
      size: 89762681
    license: PolyForm-Noncommercial-1.0.0
    redistribute: false
    reason: shape latents come from the vendored DiffSMol shape autoencoder; same noncommercial
      terms as the rest of the diffsmol family
    upstream:
      repo: https://github.com/ninglab/DiffSMol
      note: 'Shape-conditioned DiffSMol over data/moses2/ase-150k with data/moses2/shape-cache-150k,
        200 epochs / 105,600 steps, best val_loss 0.750 at epoch 175 (the checkpoint registered
        here). Unlike diffsmol/pretrained, whose conditioning channel is unusable because
        upstream''s released shape encoder se.pt is missing 87.4% of its parameters, this
        checkpoint was trained against this port''s complete deterministic encoder, so the
        latent it reads is the latent precompute_shapes.py writes. Smoke test, 48 molecules,
        bonds via smilify_openbabel: guide_stren 0.0 -> 46/48 valid (95.8%), 1.0 -> 45/48
        (93.8%), 2.0 -> 36/48 (75.0%); zero atom clashes at every setting; 48 real MOSES2
        molecules through the identical perception score 47/48 (97.9%). USE guide_stren 0.0
        -- upstream''s shipped 2.0 over-amplifies CFG for this checkpoint. atom_mode must
        be basic and atom_vocab [C,N,O,F,S,Cl,Br]. val_loss was still falling at epoch 199,
        so this is not a converged run.'
