  jodo:
    family: bond-generating-diffusion
    task_type: diffusion_jodo
    tags:
    - unconditional
    - property-conditional
    - bond-generating
    - qm9
    - geom
    variants:
      default:
        checkpoint: jodo/pretrained
        data: data/qm9/graph3d
        configs:
        - jodo_generate.yaml
      cond_gap:
        checkpoint: jodo/cond_gap
        data: data/qm9/graph3d-targets
        configs:
        - jodo_cond_generate.yaml
      geom_uncond:
        checkpoint: jodo/geom_uncond
        data: data/geom/graph3d-val
    summary: JODO diffuses coordinates, atom types, formal charges AND bond orders jointly
      in one continuous process, so a sample arrives with its bond table already drawn. It
      is the bond-generating model that holds up when the sampling budget is cut (upstream
      reports 1000 steps down to ~50), and the only one here that also generates to a requested
      QM9 property value. The GEOM variant is converted and verified tensor-for-tensor, and
      generates drug-sized molecules (33-51 atoms, 4/4 valid on a 50-step check).
  etflow:
    family: conformer-generation
    task_type: diffusion_etflow
    tags:
    - conformer
    - flow-matching
    - equivariant
    - geom-drugs
    - qm9
    variants:
      drugs-o3:
        checkpoint: etflow/drugs_o3
        data: data/geom/graph3d-multiconf-drugs
        configs:
        - etflow_generate.yaml
      qm9-o3:
        checkpoint: etflow/qm9_o3
        data: data/geom/graph3d-multiconf-qm9
    summary: ET-Flow is a conformer generator, not a de novo generator -- you hand it a molecule's
      atoms and bonds and it returns 3D conformers of that molecule. Equivariant flow matching
      from a harmonic prior, ~8.3M params. Both published o3 variants are converted tensor-for-tensor
      (488/488 drugs-o3, 492/492 qm9-o3). drugs-o3 is the default, for drug-like molecules
      over the 16-element vocab; qm9-o3 covers small C/N/O/F molecules and scored 0.029 A
      median RMSD on held-out QM9. drugs-so3 is deliberately not shipped -- upstream's yaml
      and its loader schema disagree about post-hoc parity switching. One connected molecule
      at a time -- a salt or multi-fragment input makes the harmonic prior diverge, usually
      without raising. Training on GEOM-Drugs needs a Drugs db you build yourself; the bundled
      train config reads the QM9 corpus above.
  syncogen:
    family: synthesizable-generation
    task_type: diffusion_syncogen
    tags:
    - synthesizable
    - building-blocks
    - unconditional
    - pharmacophore
    - flow-matching
    variants:
      default:
        checkpoint: syncogen/pretrained
        extra:
          vocabulary: syncogen/vocabulary
        configs:
        - syncogen_generate.yaml
      pharmacophore:
        checkpoint: syncogen/pharm
        extra:
          vocabulary: syncogen/vocabulary
        data: inputs/syncogen/reference
        configs:
        - syncogen_pharm_generate.yaml
      train-2k:
        data: data/synspace/2k
        extra:
          vocabulary: syncogen/vocabulary
        configs:
        - syncogen_train.yaml
    summary: 'SynCoGen (arXiv 2507.11818) is the only model here whose output comes with a
      recipe: every molecule is assembled from catalogue building blocks joined by real reactions,
      so what you get is something you can order and make. Nodes are building blocks and edges
      are reaction identities -- masked (absorbing) discrete diffusion over that graph, run
      jointly with flow matching over atom coordinates, and chemical bonds are DERIVED by
      RDKit assembly at the end rather than generated. Two released checkpoints, two task_types:
      `diffusion_syncogen` (unconditional) and `diffusion_syncogen_pharm` (conditioned on
      one reference ligand''s pharmacophores; not CFG -- the points enter as extra virtual
      nodes). Molecules top out at five building blocks and are limited to the 93-block, 19-reaction
      catalogue. NOTE: `syncogen/vocabulary` is required to instantiate either checkpoint
      and is NOT redistributable -- build it locally with `MolCraftDiff zoo recipe syncogen/vocabulary`.'
  oareactdiff:
    family: reaction-diffusion
    task_type: diffusion_oareactdiff
    tags:
    - transition-state
    - reaction-conditioned
    - object-aware
    - inpainting
    variants:
      default:
        checkpoint: oareactdiff/pretrained
        data: data/transition1x/reactions
        configs:
        - oareactdiff_generate.yaml
  reactot:
    family: reaction-diffusion
    task_type: diffusion_reactot
    tags:
    - transition-state
    - reaction-conditioned
    - object-aware
    - schrodinger-bridge
    - optimal-transport
    - deterministic
    variants:
      default:
        checkpoint: reactot/pretrained
        data: data/transition1x/reactions_rpsb
        configs:
        - reactot_generate.yaml
    summary: 'React-OT (Duan, Liu, Du, ..., Kulik, Nature Machine Intelligence 2025, doi:10.1038/s42256-025-01010-0;
      preprint arXiv:2404.13430 under a different title) generates the transition state of
      an elementary reaction from its reactant and product geometries. It is the successor
      to oareactdiff and shares that model''s object-aware LEFTNet backbone and Transition1x
      corpus, but it is NOT a diffusion model: it integrates a Schrodinger bridge / optimal-transport
      process from the R/P midpoint (r_pos + p_pos)/2 to the TS, so the `diffusion_` task_type
      prefix is a platform naming convention, not a claim about the objective. THE MODEL IS
      DETERMINISTIC (ot_ode: true, sigma: 0.0 -- no Gaussian is drawn anywhere), so ONE SAMPLE
      IS THE ANSWER: num_generate: 20 returns twenty identical files, and there is no best-of-N
      to rank and no confidence model to rank it with, which is the paper''s central claim.
      pos_only -- it predicts coordinates and copies atom identities from the input reaction,
      so there is no unconditional mode and you must supply a reaction. `num_steps` IS upstream''s
      --nfe, the number of network evaluations; 10 is the documented default and accuracy
      is flat from there to 100. Requires data/transition1x/reactions_rpsb specifically --
      see that asset''s note for why the sibling data/transition1x/reactions is NOT a valid
      substitute for this model.'
  chefnmr:
    family: structure-elucidation
    task_type: diffusion_chefnmr
    tags:
    - nmr
    - structure-elucidation
    - spectrum-conditioned
    - formula-conditioned
    - classifier-free-guidance
    variants:
      default:
        checkpoint: chefnmr/pretrained
        data: data/nmrshiftdb2/chefnmr
        configs:
        - chefnmr_generate.yaml
      smoke:
        checkpoint: chefnmr/pretrained
        data: data/nmrshiftdb2/chefnmr-smoke
      train-uspto:
        data: data/uspto/chefnmr
    summary: 'ChefNMR (Xiong, Zhang, Alauddin, Cheng, An, Seyedsayamdost, Zhong, NeurIPS 2025,
      arXiv:2512.03127) runs structure elucidation backwards from the spectrum: you hand it
      a measured 1H/13C NMR pair plus the molecular formula and it returns a ranked shortlist
      of complete 3D structures for the unknown. It is the only model in this zoo conditioned
      on an experimental MEASUREMENT rather than on a target, a pocket or a scaffold, and
      it rides the shared ElucidationGenerator seam rather than a bespoke sampling loop. THE
      FORMULA IS AN INPUT, never an output (upstream known_atoms: true), so it has no unconditional
      mode and deliberately no sample() -- element composition is fixed by the record and
      is therefore not evidence that the weights loaded; geometry, connectivity and exact
      identification are. Bonds are perceived from the generated geometry by RDKit afterwards,
      so RDKit perception, not the model, is the ceiling on every top-k number. Candidates
      are drawn as a BATCH, not a loop, and upstream''s published top-k is over the first
      k drawn -- generation order is the ranking, there is no scorer. The shipped default
      (ChefNMR-S, USPTO-trained, epoch 6299) is measured here at top-1 8/20 exact, max Tanimoto@10
      0.671, 87.9% bond perception and 92.8% connected over 20 NMRShiftDB2 records x 100 candidates
      at 50 Heun steps and guidance_scale 1.0. That figure is 13C-ONLY and is not the model''s
      ceiling: NMRShiftDB2 ships no 1H grid at all, so half the condition vector is zeros
      the embedder reads through its learned mask token -- which is exactly why upstream''s
      own sampling script sets test_p_drop_h1nmr=1.0. EVERY ASSET IS PUBLISHED UNDER SHARE-ALIKE
      TERMS, NOT UNDER THIS PROJECT''S MIT LICENCE -- the zoo owner''s explicit decision of
      2026-08-26. The code is MIT but the data and weights are CDLA-Sharing-1.0, with the
      NMRShiftDB2 corpus carrying the separate ODbL-derived nmrshiftdb2 Database License on
      top; both permit redistribution, and both oblige you to the same terms if you pass the
      files on. Every asset ships a NOTICE.txt carrying the licence URIs, the change notice
      and the attribution (Xiong et al. for ChefNMR; Kuhn et al. for nmrshiftdb2; Alberts
      et al. for the USPTO corpus) -- read it before redistributing, and see each asset''s
      `reason`, or `MolCraftDiff zoo recipe <asset>`, for the full audit. data/uspto/chefnmr
      is the 29.9 GB training corpus, of which one file is 26.2 GB: fetch it only if you are
      actually training.'
