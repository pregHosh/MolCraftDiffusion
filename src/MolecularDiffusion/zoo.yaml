      24,348,772 B; pockets_unconditioned_difflinker.ckpt, raw pockets_difflinker_unconditioned.ckpt,
      24,377,320 B) and 10988017 (pockets_full_difflinker.ckpt, raw pockets_difflinker_full_fc_pdb_excluded.ckpt,
