    license: CC-BY-4.0
    redistribute: true
    upstream:
      repo: https://zenodo.org/records/14855728
      note: MOSES2_training_val_dataset.pkl. The exact 150,000-molecule training pool upstream's
        released diffusion.pt was trained on -- confirmed against others/DiffSMol/data/MOSES2/MOSES2_training_val_dataset_split.pt,
        whose train (119,917) and valid (30,083) index sets partition range(150000) exactly
        with no gaps or overlap, i.e. the first 150,000 entries of the raw pkl's molecule
        list, in original order (not a random sample of the larger file). Zenodo record's
        own API metadata declares license.id "cc-by-4.0", access_right "open" (checked directly
        via https://zenodo.org/api/records/14855728, not assumed from DiffSMol's readme) --
        a separate audit from the DiffSMol code/checkpoint's PolyForm-Noncommercial licence
        (diffsmol/pretrained, above), since a repo can license its code differently from the
        corpus it trains on. Coordinates and heavy-atom element symbols only (no explicit
        hydrogens at all -- already stripped by upstream's own preprocessing); no shape embeddings
        computed yet. Run docs/model_integrations/diffsmol/scripts/precompute_shapes.py against
        this db to add shape conditioning.
  data/moses2/shape-cache-150k:
    kind: dataset
    host: datasets
    rev: main
    files:
    - path: moses2_ase_150k.pt
      sha256: a3b045955e7b049d930c00642fbf6ae7ba53ae0f5c17150176437fb5df266370
      size: 320817242
    license: PolyForm-Noncommercial-1.0.0
    redistribute: false
    reason: derived from DiffSMol's shape autoencoder; same noncommercial terms as its weights,
      as for inputs/diffsmol/shapes
    upstream:
      repo: https://github.com/ninglab/DiffSMol
      script: docs/model_integrations/diffsmol/scripts/precompute_shapes.py
      note: 'Shape latents for every molecule in data/moses2/ase-150k, keyed db_entry_0..149999
        to match PointCloudDataset.load_db. 150,000/150,000 coverage verified -- a partial
        cache trains a silently-unconditional model, since a miss falls back to the zero (CFG
        unconditional) latent. Each entry is {shape_emb (128,3), shape_center (3,), shape_volume
        float}. Built with --device cuda in ~2.3h; the VN-DGCNN encoder is 99.6% of the cost
        (3602 ms/mol on CPU vs 48 ms/mol on GPU), NOT marching cubes. NOT REPRODUCIBLE: trimesh
        mesh.sample(512) is unseeded, so a rebuild yields different latents (measured max
        delta 0.61 on a latent of scale 0.57); shape_volume is deterministic. That is why
        this is registered rather than regenerated.'
